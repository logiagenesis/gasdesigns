<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 64" width="288" height="64" role="img" aria-label="Gas Designs">
  <title>Gas Designs logo for dark backgrounds</title>
  <!-- Gas Designs. Wordmark is outlined (Space Grotesk SemiBold, SIL OFL 1.1)
       so the file renders identically without the font installed. -->
  <defs>
    <linearGradient id="gdDChrome" x1="12" y1="14" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C3D1E1"/>
      <stop offset="1" stop-color="#7C8DA1"/>
    </linearGradient>
    <linearGradient id="gdDFlame" x1="0" y1="-21" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
  <!-- Pipe ring with an open burner port. The cyan take-off line closes the G. -->
  <path d="M49.6 32.9A18 18 0 1 1 30.4 18.86" fill="none" stroke="url(#gdDChrome)" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M46.2 36.72H34" fill="none" stroke="#00AEEF" stroke-width="9.5" stroke-linecap="round"/>
  <!-- Flame at the port. The cyan core reads as complete combustion. -->
  <g transform="translate(40.5 21.5) scale(.8)">
    <path d="M3 -20.5C2.6 -15 6.6 -12.4 7.2 -8 7.8 -3.2 4.4 0.4 0 0.4 -4.4 0.4 -7.4 -3.2 -7 -7.8 -6.6 -12.4 -2 -14.2 -0.6 -19 0 -21.2 3.2 -22.4 3 -20.5Z" fill="url(#gdDFlame)"/>
